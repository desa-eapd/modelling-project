<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} - {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  </head>
  <body>
    <p>This news article has moved to its corrected publication date.</p>
    <p><a href="{{ page.redirect_to | relative_url }}">Continue to {{ page.title | escape }}</a>.</p>
  </body>
</html>
